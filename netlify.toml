[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Also set in Netlify UI (recommended) so builds don't depend only on committed .env:
  # VITE_SUPABASE_PROJECT_ID
  # VITE_SUPABASE_URL
  # VITE_SUPABASE_PUBLISHABLE_KEY

# SPA fallback for React Router deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Basic hardening for a static Vite SPA
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
